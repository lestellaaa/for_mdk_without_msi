<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опрос о сайте</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
        }
        .popup button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .popup button.yes {
            background-color: brown;
            color: white;
        }
        .popup button.no {
            background-color: white;
            color: black;
            border: 1px solid black;
        }
        .survey {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
        }
        .survey form {
            text-align: left;
        }
        .survey label {
            display: block;
            margin: 10px 0;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Основное всплывающее окно -->
    <div class="popup" id="popup">
        <p>Хотите пройти опрос о нашем сайте?</p>
        <button class="yes" onclick="showSurvey()">Да</button>
        <button class="no" onclick="hidePopup()">Нет</button>
    </div>

    <!-- Окно с опросом -->
    <div class="survey" id="survey">
        <h2>Опрос о сайте</h2>
        <form id="surveyForm">
            <label>
                1. Нравится ли вам оформление сайта?
                <select name="question1">
                    <option value="Да">Да</option>
                    <option value="Нет">Нет</option>
                </select>
            </label>
            <label>
                2. Нравятся ли вам книги, которые мы предлагаем?
                <select name="question2">
                    <option value="Да">Да</option>
                    <option value="Нет">Нет</option>
                </select>
            </label>
            <label>
                3. Нравится ли вам весь сайт в принципе?
                <select name="question3">
                    <option value="Да">Да</option>
                    <option value="Нет">Нет</option>
                </select>
            </label>
            <button type="button" onclick="submitSurvey()">Отправить</button>
        </form>
    </div>

    <!-- Полупрозрачный фон -->
    <div class="overlay" id="overlay"></div>

    <script>
        // Показать всплывающее окно
        document.getElementById('popup').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';

        // Скрыть всплывающее окно
        function hidePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // Показать окно с опросом
        function showSurvey() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('survey').style.display = 'block';
        }

        // Отправить данные опроса
        function submitSurvey() {
            const form = document.getElementById('surveyForm');
            const answers = {
                question1: form.question1.value,
                question2: form.question2.value,
                question3: form.question3.value
            };

            // Формируем текст письма
            const emailBody = `1. Нравится ли вам оформление сайта? ${answers.question1}\n` +
                              `2. Нравятся ли вам книги, которые мы предлагаем? ${answers.question2}\n` +
                              `3. Нравится ли вам весь сайт в принципе? ${answers.question3}`;

            // Отправляем письмо через почтовый клиент
            const mailtoUrl = `mailto:elislesa12@gmail.com?subject=Опрос о сайте&body=${encodeURIComponent(emailBody)}`;
            window.location.href = mailtoUrl;

            // Закрываем окно опроса
            document.getElementById('survey').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
